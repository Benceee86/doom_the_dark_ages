        <h1 class="text-center mx-4 p3 mt mb-5 fs-1">Contact</h1>
        <p class="fs-5 text-center w-25 mx-auto mb">Amennyiben bármilyen kérdése, észrevétele van a weboldallal
            kapcsolatban, vagy
            csak szeretne kapcsolatba lépni velünk, kérjük, küldjön emailt nekünk!</p>

        <div class="reveal container rounded-3 bg-dark-css p-5 m-5 mx-auto w-25 mb">
            <form>
                <div class="mb-3">
                    <label for="email" class="form-label">Email cím</label>
                    <input type="email" class="form-control" id="email" placeholder="Írja be az email-címét">
                </div>
                <div class="mb-3">
                    <label for="message" class="form-label">Üzenet</label>
                    <textarea class="form-control" id="message" rows="4" placeholder="Írja be az üzenetét"></textarea>
                    <button type="submit" class="btn btn-primary mt-3">Küldés</button>
            </form>

        </div>
    </main>
